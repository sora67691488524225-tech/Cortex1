<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CORTEX 1.0</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #101116;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }
    header {
      padding: 16px;
      background: #191a22;
      border-bottom: 1px solid #30313b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h2 { margin: 0; font-size: 21px; }
    header span { color: #8d91a5; font-size: 12px; }
    button, textarea {
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
    }
    #clear {
      background: #292b36;
      color: #ddd;
      padding: 9px 12px;
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 850px;
      width: fit-content;
      padding: 12px 15px;
      border-radius: 15px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
    .user {
      align-self: flex-end;
      background: #4544c8;
    }
    .ai {
      align-self: flex-start;
      background: #22242e;
    }
    .label {
      display: block;
      font-size: 11px;
      opacity: .65;
      margin-bottom: 5px;
    }
    #welcome {
      margin: auto;
      text-align: center;
      color: #aeb0c0;
    }
    #welcome h1 {
      color: #fff;
      font-size: 34px;
      margin-bottom: 8px;
    }
    footer {
      padding: 12px;
      background: #191a22;
      border-top: 1px solid #30313b;
    }
    #form {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 150px;
      padding: 14px;
      border: 1px solid #383a48;
      border-radius: 13px;
      outline: none;
      background: #242631;
      color: white;
    }
    textarea:focus { border-color: #7775ff; }
    #send {
      background: #6664ed;
      color: white;
      padding: 14px 18px;
      min-height: 48px;
    }
    #send:disabled { opacity: .5; cursor: wait; }
    .hint {
      text-align: center;
      color: #777b8e;
      font-size: 11px;
      margin-top: 8px;
    }
    @media (max-width: 500px) {
      #chat { padding: 12px; }
      header { padding: 13px; }
      header h2 { font-size: 18px; }
      .message { max-width: 92%; }
      #send { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h2>CORTEX 1.0</h2>
      <span>AI Assistant</span>
    </div>
    <button id="clear">Очистити чат</button>
  </header>

  <main id="chat">
    <div id="welcome">
      <h1>CORTEX</h1>
      <p>Чим можу допомогти?</p>
    </div>
  </main>

  <footer>
    <form id="form">
      <textarea id="input" placeholder="Напиши повідомлення..." rows="1"></textarea>
      <button id="send" type="submit">➤</button>
    </form>
    <div class="hint">CORTEX може помилятися. Перевіряй важливу інформацію.</div>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const clear = document.getElementById("clear");

    const STORAGE_KEY = "cortex_1_0_history";
    let history = [];
    let busy = false;

    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) history = JSON.parse(saved);
      if (!Array.isArray(history)) history = [];
    } catch {
      history = [];
    }

    function saveHistory() {
      try {
        // Зберігаємо останні 20 повідомлень
        history = history.slice(-20);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      } catch (error) {
        console.error("Не вдалося зберегти історію:", error);
      }
    }

    function addMessage(role, text) {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      const bubble = document.createElement("div");
      bubble.className = "message " + (role === "user" ? "user" : "ai");

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = role === "user" ? "Ти" : "CORTEX";

      const content = document.createElement("div");
      content.textContent = text;

      bubble.appendChild(label);
      bubble.appendChild(content);
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;

      return content;
    }

    function renderHistory() {
      chat.innerHTML = "";

      if (history.length === 0) {
        chat.innerHTML = `
          <div id="welcome">
            <h1>CORTEX</h1>
            <p>Чим можу допомогти?</p>
          </div>`;
        return;
      }

      history.forEach(message => {
        if (message.role === "user" || message.role === "assistant") {
          addMessage(
            message.role === "assistant" ? "ai" : "user",
            message.content
          );
        }
      });
    }

    renderHistory();

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 150) + "px";
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text || busy) return;

      busy = true;
      send.disabled = true;
      input.value = "";
      input.style.height = "auto";

      history.push({ role: "user", content: text });
      saveHistory();
      addMessage("user", text);

      const replyBox = addMessage("ai", "Думаю...");
      let answer = "";

      try {
        const messages = history.map(message => ({
          role: message.role,
          content: message.content
        }));

        const response = await puter.ai.chat(messages);

        if (typeof response === "string") {
          answer = response;
        } else if (response?.message?.content) {
          const content = response.message.content;
          answer = Array.isArray(content)
            ? content.map(part => part.text || "").join("\n")
            : content;
        } else {
          answer = "Не вдалося прочитати відповідь. Спробуй ще раз.";
        }
      } catch (error) {
        console.error(error);
        answer = "Помилка підключення до AI. Перевір інтернет і спробуй ще раз.";
      }

      replyBox.textContent = answer;

      history.push({ role: "assistant", content: answer });
      saveHistory();

      busy = false;
      send.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    });

    clear.addEventListener("click", () => {
      if (!confirm("Точно очистити всю історію чату?")) return;

      history = [];
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    });
  </script>
</body>
</html>
